<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marinho Investment — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06090a; --bg2: #0d1517; --card: #111a1c; --border: #1e2d30;
    --gold: #c9a84c; --gold2: #e8c96a; --green: #2ec97a; --red: #e05252;
    --blue: #4cb8c9; --text: #e2e8ea; --muted: #6b8085;
    --font-head: 'Cormorant Garamond', serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-mono); min-height: 100vh; }
  .header {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-family: var(--font-head); font-size: 1.2rem; font-weight: 400; color: var(--gold); }
  .header span { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .btn-logout {
    background: none; border: 1px solid var(--border); border-radius: 4px; padding: 0.4rem 0.9rem;
    color: var(--muted); font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 1.25rem; }
  .kpi-label { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .kpi-value { font-size: 1.8rem; font-weight: 300; }
  .kpi-value.gold { color: var(--gold); }
  .kpi-value.green { color: var(--green); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; }
  .card-title { font-family: var(--font-head); font-size: 1.1rem; font-weight: 400; color: var(--text); margin-bottom: 1.25rem; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.73rem; }
  th { text-align: left; padding: 0.6rem 0.75rem; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 400; }
  td { padding: 0.75rem 0.75rem; border-bottom: 1px solid rgba(30,45,48,0.5); vertical-align: middle; }
  tr:hover td { background: rgba(201,168,76,0.03); }

  .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .badge.ativo   { background: rgba(46,201,122,0.12); color: var(--green); border: 1px solid rgba(46,201,122,0.2); }
  .badge.pendente{ background: rgba(201,168,76,0.12); color: var(--gold);  border: 1px solid rgba(201,168,76,0.2); }
  .badge.inativo { background: rgba(224,82,82,0.12);  color: var(--red);   border: 1px solid rgba(224,82,82,0.2); }
  .badge.pro     { background: rgba(201,168,76,0.15); color: var(--gold);  border: 1px solid var(--gold); }
  .badge.basico  { background: rgba(107,128,133,0.12);color: var(--muted); border: 1px solid var(--border); }

  select {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 4px;
    padding: 0.35rem 0.6rem; font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--text); outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--gold); }
  select option { background: var(--bg2); }

  .btn {
    padding: 0.4rem 0.9rem; background: var(--gold); color: #08100f; border: none;
    border-radius: 4px; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { background: var(--gold2); }
  .btn.sm { padding: 0.3rem 0.65rem; font-size: 0.63rem; }

  .filter-bar { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .filter-bar select { font-size: 0.7rem; }

  .msg { padding: 0.6rem 1rem; border-radius: 4px; font-size: 0.72rem; margin: 0.75rem 0; display: none; }
  .msg.success { background: rgba(46,201,122,0.1); border: 1px solid rgba(46,201,122,0.3); color: var(--green); display: block; }
  .msg.error   { background: rgba(224,82,82,0.1);  border: 1px solid rgba(224,82,82,0.3);  color: var(--red);   display: block; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Marinho Investment</h1>
    <span>Painel Administrativo</span>
  </div>
  <button class="btn-logout" onclick="logout()">Sair</button>
</div>

<div class="wrap">

  <div class="kpis">
    <div class="kpi"><div class="kpi-label">Total Usuários</div><div class="kpi-value" id="k-total">—</div></div>
    <div class="kpi"><div class="kpi-label">Ativos</div><div class="kpi-value green" id="k-ativos">—</div></div>
    <div class="kpi"><div class="kpi-label">Pendentes</div><div class="kpi-value" style="color:var(--gold)" id="k-pendentes">—</div></div>
    <div class="kpi"><div class="kpi-label">MRR Estimado</div><div class="kpi-value gold" id="k-mrr">—</div></div>
  </div>

  <div class="card">
    <div class="card-title">Usuários</div>
    <div class="filter-bar">
      <select id="filtro-status" onchange="filtrar()">
        <option value="">Todos os status</option>
        <option value="pendente">Pendentes</option>
        <option value="ativo">Ativos</option>
        <option value="inativo">Inativos</option>
      </select>
      <select id="filtro-plano" onchange="filtrar()">
        <option value="">Todos os planos</option>
        <option value="basico">Básico</option>
        <option value="pro">Pro</option>
      </select>
    </div>
    <div id="msg-admin" class="msg"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Plano</th><th>Status</th><th>Cadastro</th><th>Ações</th></tr></thead>
        <tbody id="tb-users"><tr><td colspan="6" style="color:var(--muted);text-align:center;padding:2rem;">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const SUPABASE_URL = window.MARINHO_SUPABASE_CONFIG?.url;
const SUPABASE_ANON = window.MARINHO_SUPABASE_CONFIG?.anonKey;
if (!SUPABASE_URL || !SUPABASE_ANON) {
  throw new Error('Configure o arquivo config.js com a URL e a chave publica do Supabase.');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let USERS = [], ADMIN_ID = null;

// ── INIT ─────────────────────────────────────────
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return window.location.href = 'index.html';

  const { data: isAdmin } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (!isAdmin) return window.location.href = 'dashboard.html';

  ADMIN_ID = session.user.id;
  await loadUsers();
})();

// ── LOAD ─────────────────────────────────────────
async function loadUsers() {
  const { data, error } = await sb.rpc('admin_listar_usuarios');
  if (error) { document.getElementById('tb-users').innerHTML = `<tr><td colspan="6" style="color:var(--red);text-align:center;padding:2rem;">${error.message}</td></tr>`; return; }
  USERS = data || [];
  updateKPIs();
  renderTable(USERS);
}

function updateKPIs() {
  const ativos   = USERS.filter(u => u.status === 'ativo').length;
  const pendentes= USERS.filter(u => u.status === 'pendente').length;
  const mrr      = USERS.filter(u => u.status === 'ativo').reduce((s, u) => s + (u.plano === 'pro' ? 49 : 20), 0);
  document.getElementById('k-total').textContent    = USERS.length;
  document.getElementById('k-ativos').textContent   = ativos;
  document.getElementById('k-pendentes').textContent= pendentes;
  document.getElementById('k-mrr').textContent      = 'R$ ' + mrr.toFixed(0);
}

function renderTable(users) {
  const tb = document.getElementById('tb-users');
  if (!users.length) { tb.innerHTML = '<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:2rem;">Nenhum usuário encontrado.</td></tr>'; return; }
  tb.innerHTML = users.map(u => `
    <tr id="row-${u.id}">
      <td><strong>${u.nome || '—'}</strong></td>
      <td style="color:var(--muted)">${u.email}</td>
      <td>
        <select onchange="updateUser('${u.id}', this.value, null)">
          <option value="basico" ${u.plano === 'basico' ? 'selected' : ''}>Básico — R$20</option>
          <option value="pro"    ${u.plano === 'pro'    ? 'selected' : ''}>Pro — R$49</option>
        </select>
      </td>
      <td><span class="badge ${u.status}">${u.status}</span></td>
      <td style="color:var(--muted)">${new Date(u.created_at).toLocaleDateString('pt-BR')}</td>
      <td style="display:flex;gap:0.4rem;flex-wrap:wrap;">
        ${u.status !== 'ativo'   ? `<button class="btn sm" onclick="updateUser('${u.id}', null, 'ativo')">Ativar</button>` : ''}
        ${u.status !== 'inativo' ? `<button class="btn sm" style="background:none;border:1px solid var(--red);color:var(--red);" onclick="updateUser('${u.id}', null, 'inativo')">Desativar</button>` : ''}
        ${u.status !== 'pendente'? `<button class="btn sm" style="background:none;border:1px solid var(--border);color:var(--muted);" onclick="updateUser('${u.id}', null, 'pendente')">Pendente</button>` : ''}
      </td>
    </tr>`).join('');
}

async function updateUser(uid, plano, status) {
  const msg = document.getElementById('msg-admin');
  const user = USERS.find(u => u.id === uid);
  if (!user) return;

  const newStatus = status || user.status;
  const newPlano  = plano  || user.plano;

  const { error } = await sb.rpc('admin_update_usuario', {
    target_id: uid, new_status: newStatus, new_plano: newPlano
  });

  if (error) return showMsg(msg, 'Erro: ' + error.message, 'error');

  user.status = newStatus; user.plano = newPlano;
  updateKPIs();
  filtrar();
  showMsg(msg, 'Usuário atualizado com sucesso.', 'success');
}

function filtrar() {
  const status = document.getElementById('filtro-status').value;
  const plano  = document.getElementById('filtro-plano').value;
  let lista = USERS;
  if (status) lista = lista.filter(u => u.status === status);
  if (plano)  lista = lista.filter(u => u.plano  === plano);
  renderTable(lista);
}

async function logout() { await sb.auth.signOut(); window.location.href = 'index.html'; }

function showMsg(el, txt, type) {
  el.textContent = txt; el.className = 'msg ' + type;
  setTimeout(() => el.style.display = 'none', 3000);
}
</script>
</body>
</html>
