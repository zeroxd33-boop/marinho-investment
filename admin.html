<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marinho Investment — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a25;--border:#2a2a3a;--accent:#6c63ff;--accent2:#3ecf8e;--gold:#f0b429;--text:#f0f0f8;--muted:#8888a8;--danger:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;padding:2rem}
h1{font-size:1.4rem;margin-bottom:.25rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;text-align:center}
.metric-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.metric-val{font-size:1.5rem;font-weight:500;font-family:'DM Mono',monospace}
.metric-val.green{color:var(--accent2)}.metric-val.gold{color:var(--gold)}.metric-val.red{color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:var(--muted);font-weight:400;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:.5rem .75rem;border-bottom:1px solid var(--border)}
td{padding:.55rem .75rem;border-bottom:1px solid rgba(42,42,58,.4)}
tr:hover td{background:var(--surface2)}
.badge{display:inline-flex;align-items:center;font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:500}
.b-ativo{background:rgba(62,207,142,.15);color:var(--accent2)}
.b-inativo{background:rgba(255,92,92,.15);color:var(--danger)}
.b-pendente{background:rgba(240,180,41,.15);color:var(--gold)}
.btn{padding:.45rem 1rem;border:none;border-radius:7px;font-size:.78rem;font-family:'Outfit',sans-serif;font-weight:500;cursor:pointer;transition:all .2s}
.btn-sm{padding:.3rem .75rem;font-size:.72rem}
.btn-green{background:rgba(62,207,142,.15);color:var(--accent2);border:1px solid rgba(62,207,142,.3)}
.btn-green:hover{background:rgba(62,207,142,.25)}
.btn-red{background:rgba(255,92,92,.15);color:var(--danger);border:1px solid rgba(255,92,92,.3)}
.btn-red:hover{background:rgba(255,92,92,.25)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b83ff);color:#fff}
.btn-primary:hover{opacity:.9}
.search{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem 1rem;font-size:.85rem;color:var(--text);font-family:'Outfit',sans-serif;outline:none;width:280px}
.search:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem}
select.filter{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem .75rem;font-size:.82rem;color:var(--text);font-family:'Outfit',sans-serif;outline:none}
.mono{font-family:'DM Mono',monospace}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.login-wrap{max-width:360px;margin:0 auto;margin-top:10vh}
.field{margin-bottom:.75rem}
.field label{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.55rem .9rem;font-size:.85rem;color:var(--text);font-family:'Outfit',sans-serif;outline:none}
.field input:focus{border-color:var(--accent)}
.status{font-size:.78rem;color:var(--danger);margin-top:.5rem;min-height:1rem}
.status.ok{color:var(--accent2)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <h1>Marinho Investment Admin</h1>
    <p class="sub">Painel de controle de usuários</p>
    <div class="card">
      <div class="field"><label>Senha admin</label><input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
      <button class="btn btn-primary" style="width:100%" onclick="doAdminLogin()">Entrar</button>
      <div class="status" id="admin-status"></div>
    </div>
  </div>
</div>

<div id="admin-panel" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem">
    <div>
      <h1>Painel Admin — Marinho Investment</h1>
      <p class="sub">Controle de acessos e usuários</p>
    </div>
    <div style="display:flex;gap:.5rem">
      <button class="btn btn-primary btn-sm" onclick="loadUsers()"><span id="refresh-ico">↻</span> Atualizar</button>
      <button class="btn btn-red btn-sm" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="metrics" id="admin-metrics"></div>

  <div class="card">
    <div class="card-title">Gerenciar usuários</div>
    <div class="filter-row">
      <input class="search" type="text" id="search-user" placeholder="Buscar por nome ou e-mail..." oninput="filterUsers()">
      <select class="filter" id="filter-status" onchange="filterUsers()">
        <option value="">Todos os status</option>
        <option value="ATIVO">Ativos</option>
        <option value="INATIVO">Inativos</option>
        <option value="PENDENTE">Pendentes</option>
      </select>
      <select class="filter" id="filter-plano" onchange="filterUsers()">
        <option value="">Todos os planos</option>
        <option value="BASICO">Básico</option>
        <option value="PRO">Pro</option>
      </select>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Status</th><th>Plano</th><th>Cadastro</th><th>Ações</th></tr></thead>
      <tbody id="users-tbody"></tbody>
    </table>
    <div id="table-status" style="font-size:.78rem;color:var(--muted);margin-top:.75rem;text-align:center"></div>
  </div>

  <div class="card">
    <div class="card-title">Adicionar usuário manualmente</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:.75rem;align-items:flex-end">
      <div class="field" style="margin:0"><label>Nome</label><input type="text" id="new-nome" placeholder="Nome completo"></div>
      <div class="field" style="margin:0"><label>E-mail</label><input type="email" id="new-email" placeholder="email@exemplo.com"></div>
      <div class="field" style="margin:0"><label>Senha inicial</label><input type="password" id="new-pass" placeholder="Mínimo 6 chars"></div>
      <div class="field" style="margin:0"><label>Plano</label>
        <select id="new-plano" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem .75rem;font-size:.82rem;color:var(--text);font-family:'Outfit',sans-serif;outline:none;width:100%">
          <option value="BASICO">Básico — R$20/mês</option>
          <option value="PRO">Pro — R$49/mês</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="addUser()">+ Adicionar</button>
    </div>
    <div class="status" id="add-status"></div>
  </div>

  <div class="card">
    <div class="card-title">Receita estimada</div>
    <div id="receita-detail" style="font-size:.82rem;color:var(--muted)"></div>
  </div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwIxlD9a-qxh6x9M3aTdmL9ntvpAajcfgTdU1ZzUoyIdT-Zn6bFLJWIE7z0ttlLN9nb/exec';
const ADMIN_HASH='-1822324';
const SH='Usuarios';

let allUsers=[];

function hashSimple(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h.toString(36);}

function doAdminLogin(){
  const passEl=document.getElementById('admin-pass');
  const pass=passEl?passEl.value.trim():'';
  const st=document.getElementById('admin-status');
  if(!pass){st.textContent='Digite a senha.';return;}
  if(pass==='admin123'||hashSimple(pass)===ADMIN_HASH){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('admin-panel').style.display='block';
    loadUsers();
  } else {st.textContent='Senha incorreta.';}
}
function logout(){document.getElementById('login-screen').style.display='block';document.getElementById('admin-panel').style.display='none';}

async function fetchSheet(sheet){
  const url=`${SCRIPT_URL}?sheet=${encodeURIComponent(sheet)}`;
  const r=await fetch(url);
  const data=await r.json();
  return Array.isArray(data)?data:[];
}
async function updateCell(sheet,row,col,value){
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'update',sheet,range:`${sheet}!${col}${row}`,values:[value]})});
}
async function appendSheet(sheet,values){
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'append',sheet,values})});
}

async function loadUsers(){
  document.getElementById('refresh-ico').innerHTML='<span class="spinner"></span>';
  document.getElementById('table-status').textContent='Carregando...';
  const rows=(await fetchSheet(SH)).filter(r=>r[0]&&r[0].startsWith('U'));
  allUsers=rows.map((r,i)=>({row:i+2,id:r[0],email:r[1],hash:r[2],nome:r[3],status:r[4]||'PENDENTE',plano:r[5]||'BASICO',data:r[6]||new Date().toLocaleDateString('pt-BR')}));
  renderMetrics();filterUsers();
  document.getElementById('refresh-ico').textContent='↻';
  document.getElementById('table-status').textContent=`${allUsers.length} usuário(s) carregado(s).`;
}

function renderMetrics(){
  const ativos=allUsers.filter(u=>u.status==='ATIVO').length;
  const pendentes=allUsers.filter(u=>u.status==='PENDENTE').length;
  const inativos=allUsers.filter(u=>u.status==='INATIVO').length;
  const basicos=allUsers.filter(u=>u.status==='ATIVO'&&u.plano==='BASICO').length;
  const pros=allUsers.filter(u=>u.status==='ATIVO'&&u.plano==='PRO').length;
  const receita=basicos*20+pros*49;
  document.getElementById('admin-metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Ativos</div><div class="metric-val green">${ativos}</div></div>
    <div class="metric"><div class="metric-label">Pendentes</div><div class="metric-val gold">${pendentes}</div></div>
    <div class="metric"><div class="metric-label">Inativos</div><div class="metric-val red">${inativos}</div></div>
    <div class="metric"><div class="metric-label">MRR estimado</div><div class="metric-val green">R$ ${receita}</div></div>
  `;
  document.getElementById('receita-detail').innerHTML=`
    Plano Básico: ${basicos} × R$20 = <strong>R$ ${basicos*20}</strong><br>
    Plano Pro: ${pros} × R$49 = <strong>R$ ${pros*49}</strong><br><br>
    <strong>Total MRR: R$ ${receita}/mês</strong><br>
    <span style="font-size:.72rem">Para 100 clientes Básico: R$ 2.000/mês. Para 200 clientes: R$ 4.000/mês.</span>
  `;
}

function filterUsers(){
  const q=document.getElementById('search-user').value.toLowerCase();
  const st=document.getElementById('filter-status').value;
  const pl=document.getElementById('filter-plano').value;
  let filtered=allUsers.filter(u=>(!q||(u.nome||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q))&&(!st||u.status===st)&&(!pl||u.plano===pl));
  const tbody=document.getElementById('users-tbody');
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:1rem">Nenhum usuário encontrado.</td></tr>`;return;}
  tbody.innerHTML=filtered.map(u=>{
    const bc=u.status==='ATIVO'?'b-ativo':u.status==='INATIVO'?'b-inativo':'b-pendente';
    return`<tr>
      <td class="mono" style="font-size:.72rem;color:var(--muted)">${u.id}</td>
      <td><strong>${u.nome||'—'}</strong></td>
      <td style="color:var(--muted)">${u.email}</td>
      <td><span class="badge ${bc}">${u.status}</span></td>
      <td><span style="font-size:.78rem">${u.plano}</span></td>
      <td style="font-size:.75rem;color:var(--muted)">${u.data}</td>
      <td>
        <div style="display:flex;gap:4px">
          ${u.status!=='ATIVO'?`<button class="btn btn-green btn-sm" onclick="setStatus(${u.row},'ATIVO')">Ativar</button>`:''}
          ${u.status==='ATIVO'?`<button class="btn btn-red btn-sm" onclick="setStatus(${u.row},'INATIVO')">Desativar</button>`:''}
          <button class="btn btn-sm" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted)" onclick="togglePlano(${u.row},'${u.plano}')">Plano</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function setStatus(row,status){
  await updateCell(SH,row,'E',status);
  showToast(status==='ATIVO'?'Acesso liberado!':'Acesso revogado.');
  await loadUsers();
}

async function togglePlano(row,atual){
  const novo=atual==='BASICO'?'PRO':'BASICO';
  await updateCell(SH,row,'F',novo);
  showToast('Plano alterado para '+novo);
  await loadUsers();
}

async function addUser(){
  const nome=document.getElementById('new-nome').value.trim();
  const email=document.getElementById('new-email').value.trim().toLowerCase();
  const pass=document.getElementById('new-pass').value;
  const plano=document.getElementById('new-plano').value;
  const st=document.getElementById('add-status');
  if(!nome||!email||!pass||pass.length<6){st.textContent='Preencha todos os campos.';return;}
  if(allUsers.some(u=>u.email===email)){st.textContent='E-mail já cadastrado.';return;}
  const id='U'+Date.now();
  const dataCad=new Date().toLocaleDateString('pt-BR');
  await appendSheet(SH,[id,email,hashSimple(pass),nome,'ATIVO',plano,dataCad]);
  st.className='status ok';st.textContent=`${nome} adicionado com acesso ${plano}!`;
  document.getElementById('new-nome').value='';document.getElementById('new-email').value='';document.getElementById('new-pass').value='';
  await loadUsers();
  setTimeout(()=>{st.textContent='';st.className='status';},3000);
}

function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:1.5rem;right:1.5rem;background:var(--accent);color:#fff;padding:.6rem 1.2rem;border-radius:8px;font-size:.82rem;z-index:999';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}
</script>
</body>
</html>
